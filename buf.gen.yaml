# Regenerate with `make generate` (wraps `buf generate`). Output under
# gen/, web/src/gen/, openapi/ and schema/ is committed and never hand
# edited; CI fails if `buf generate` would change it
# (.github/workflows/ci.yml, job "proto").
version: v2
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc-ecosystem/gateway
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc-ecosystem/openapiv2
    out: openapi
    opt:
      - output_format=json
      - allow_merge=true
      - merge_file_name=touchstone.v1
  - remote: buf.build/bufbuild/es
    out: web/src/gen
  - remote: buf.build/bufbuild/protoschema-jsonschema
    out: schema
