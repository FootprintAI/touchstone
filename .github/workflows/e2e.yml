name: e2e
on:
  pull_request:
    paths: [Dockerfile, docker-compose.yml, .dockerignore, test/**, cmd/**, internal/**, web/**, proto/**, .github/workflows/e2e.yml]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash test/e2e/run.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-out
          path: test/e2e/out
