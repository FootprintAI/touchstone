# fixture-vendor: serves test/fixtures/sites and logs every request to the
# access log that test/e2e/run.sh checks against the report's checked list.
server {
    listen 80;
    root /usr/share/nginx/html;

    access_log /var/log/fixture/access.log combined;

    # Compose's health check. Not logged, so the passive-only check never
    # sees it.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
